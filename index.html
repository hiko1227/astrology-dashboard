<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人星盤能量儀表板 | Mystic Dashboard</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts 復古/神祕字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #070913;
            color: #e2e8f0;
            background-image: radial-gradient(circle at 50% 20%, #1a1c36 0%, #070913 70%);
            min-height: 100vh;
        }
        .cinzel-font {
            font-family: 'Cinzel', serif;
        }
        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .gold-glow {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }
        .gold-text {
            color: #f3e5ab;
        }
        .gold-bg {
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- 頂部標題列 -->
        <header class="flex flex-col md:flex-row justify-between items-center border-b border-amber-500/30 pb-6">
            <div>
                <h1 class="cinzel-font text-3xl md:text-4xl font-bold gold-text tracking-wider text-center md:text-left">✨ ASTROLOGY DASHBOARD</h1>
                <p class="text-xs text-amber-200/60 tracking-widest text-center md:text-left mt-1">你的專屬宇宙能量儀表板</p>
            </div>
            <button onclick="toggleSettings()" class="mt-4 md:mt-0 px-4 py-2 text-xs cinzel-font tracking-widest gold-border rounded-lg text-amber-300 hover:bg-amber-500/10 transition">
                ⚙️ 本命盤設定
            </button>
        </header>

        <!-- 設定抽屜 (預設隱藏) -->
        <div id="settings-panel" class="hidden gold-border bg-[#0f1423] p-6 rounded-2xl gold-glow space-y-4">
            <h3 class="cinzel-font text-lg gold-text font-semibold">輸入你的出生密碼</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-amber-200/70 mb-1">出生日期</label>
                    <input type="date" id="birth-date" class="w-full bg-[#070913] gold-border rounded p-2 text-sm text-amber-100 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-amber-200/70 mb-1">出生時間 (精確)</label>
                    <input type="time" id="birth-time" class="w-full bg-[#070913] gold-border rounded p-2 text-sm text-amber-100 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-amber-200/70 mb-1">出生地點</label>
                    <input type="text" id="birth-place" placeholder="例如：香港" class="w-full bg-[#070913] gold-border rounded p-2 text-sm text-amber-100 focus:outline-none">
                </div>
            </div>
            <button onclick="saveSettings()" class="gold-bg text-gray-950 font-bold px-6 py-2 rounded text-xs cinzel-font tracking-wider hover:opacity-90 transition">
                儲存設定
            </button>
        </div>

        <!-- 核心資訊卡片區 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 本命盤速查 -->
            <div class="gold-border bg-[#0b101f]/80 p-6 rounded-2xl gold-glow space-y-4">
                <h2 class="cinzel-font text-sm gold-text tracking-widest uppercase border-b border-amber-500/20 pb-2">✦ 本命盤核心</h2>
                <div class="space-y-2 text-sm">
                    <p class="flex justify-between"><span class="text-gray-400">太陽星座：</span><span id="display-sun" class="gold-font font-bold gold-text">-</span></p>
                    <p class="flex justify-between"><span class="text-gray-400">出生日期：</span><span id="display-date">-</span></p>
                    <p class="flex justify-between"><span class="text-gray-400">出生時間：</span><span id="display-time">-</span></p>
                    <p class="flex justify-between"><span class="text-gray-400">出生地點：</span><span id="display-place">-</span></p>
                </div>
            </div>

            <!-- 今日星象能量 -->
            <div class="gold-border bg-[#0b101f]/80 p-6 rounded-2xl gold-glow space-y-4">
                <h2 class="cinzel-font text-sm gold-text tracking-widest uppercase border-b border-amber-500/20 pb-2">✦ 今日宇宙頻率</h2>
                <div class="space-y-3 text-sm">
                    <div>
                        <span class="text-xs text-amber-200/60 block">當年月相</span>
                        <span class="gold-text font-semibold text-base">盈凸月 (Waxing Gibbous)</span>
                    </div>
                    <div>
                        <span class="text-xs text-amber-200/60 block">今日關鍵能量</span>
                        <p class="text-xs text-gray-300 mt-1">直覺力敏銳，適合整理思緒、為即將到來的目標做最後部署。</p>
                    </div>
                </div>
            </div>

            <!-- 本月焦點轉折 -->
            <div class="gold-border bg-[#0b101f]/80 p-6 rounded-2xl gold-glow space-y-4">
                <h2 class="cinzel-font text-sm gold-text tracking-widest uppercase border-b border-amber-500/20 pb-2">✦ 本月星象提示</h2>
                <ul class="space-y-2 text-xs text-gray-300">
                    <li class="flex items-start space-x-2">
                        <span class="text-amber-400">⚡</span>
                        <span>注意人際溝通，避免過度主觀。</span>
                    </li>
                    <li class="flex items-start space-x-2">
                        <span class="text-amber-400">🌙</span>
                        <span>新月前後適合釐清內心深處渴望。</span>
                    </li>
                </ul>
            </div>

        </div>

        <!-- 底部能量筆記 / 待辦 -->
        <div class="gold-border bg-[#0b101f]/80 p-6 rounded-2xl gold-glow space-y-4">
            <h2 class="cinzel-font text-sm gold-text tracking-widest uppercase border-b border-amber-500/20 pb-2">✦ 每日靈感與反思 Journal</h2>
            <textarea placeholder="寫低你今日感受到嘅直覺、夢境或者星象感應..." class="w-full h-24 bg-[#070913] gold-border rounded-lg p-3 text-sm text-amber-100 focus:outline-none resize-none"></textarea>
            <div class="flex justify-end">
                <button onclick="alert('筆記已儲存至心靈深處 ✨')" class="gold-bg text-gray-950 font-bold px-4 py-2 rounded text-xs cinzel-font tracking-wider hover:opacity-90 transition">
                    記錄能量
                </button>
            </div>
        </div>

    </div>

    <script>
        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
        }

        function getZodiacSign(day, month) {
            const dates = [20, 19, 21, 20, 21, 22, 23, 23, 23, 23, 22, 22];
            const signs = ['摩羯座', '水瓶座', '雙魚座', '白羊座', '金牛座', '雙子座', '巨蟹座', '獅子座', '處女座', '天秤座', '天蠍座', '射手座', '摩羯座'];
            return day < dates[month - 1] ? signs[month - 1] : signs[month];
        }

        function saveSettings() {
            const date = document.getElementById('birth-date').value;
            const time = document.getElementById('birth-time').value;
            const place = document.getElementById('birth-place').value;

            if (date) {
                localStorage.setItem('birth_date', date);
                localStorage.setItem('birth_time', time);
                localStorage.setItem('birth_place', place);
                loadSettings();
                toggleSettings();
            }
        }

        function loadSettings() {
            const date = localStorage.getItem('birth_date');
            const time = localStorage.getItem('birth_time');
            const place = localStorage.getItem('birth_place');

            if (date) {
                document.getElementById('display-date').innerText = date;
                document.getElementById('birth-date').value = date;
                
                const [year, month, day] = date.split('-').map(Number);
                document.getElementById('display-sun').innerText = getZodiacSign(day, month);
            }
            if (time) {
                document.getElementById('display-time').innerText = time;
                document.getElementById('birth-time').value = time;
            }
            if (place) {
                document.getElementById('display-place').innerText = place;
                document.getElementById('birth-place').value = place;
            }
        }

        window.onload = loadSettings;
    </script>
</body>
</html>
